[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "qxide"
# Intentionally independent of Cargo.toml (0.4.0): first PyPI release is 0.0.1. See docs/release.md.
version = "0.0.1"
description = "Early Qxide experiment: Rust-like quantum/classical language CLI (OpenQASM 3 output, state-vector/stabilizer simulators)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
keywords = ["quantum", "qubit", "openqasm", "simulator"]
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://qxide.dev"
Repository = "https://github.com/qxide-lang/qxide"

[tool.maturin]
bindings = "bin"

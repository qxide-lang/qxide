[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "qxide"
# Version comes from Cargo.toml so the wheel and `qxide --version` always match.
dynamic = ["version"]
description = "Qxide command-line tool: a language for classical and quantum computers with C-style syntax, compile-time qubit safety like Rust's ownership, and OpenQASM 3 output"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
keywords = ["quantum", "qubit", "openqasm", "simulator"]
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://qxide.dev"
Repository = "https://github.com/qxide-lang/qxide"

[tool.maturin]
bindings = "bin"
# `import qxide`: a pure-Python module that runs the bundled CLI (roadmap 4c).
python-source = "python"
# Same as the GitHub release binaries: include the Cranelift JIT (`--engine jit`).
features = ["jit"]

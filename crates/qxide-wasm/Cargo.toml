[package]
name = "qxide-wasm"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qxide = { path = "../..", default-features = false }

# Built only for the qxide.dev playground; not a cargo-dist app.
[package.metadata.dist]
dist = false

# src/lang (compiled here too) has code for the CLI-only `jit` feature, which is never on here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("jit"))'] }

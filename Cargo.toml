[package]
name = "qxide"
version = "0.1.0"
edition = "2021"
description = "Early experiment for Qxide, a Rust-like quantum/classical language: qubit ownership as Rust types, OpenQASM 3 output, tiny state-vector simulator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qxide-lang/qxide"
homepage = "https://qxide.dev"
readme = "README.md"
keywords = ["quantum", "qubit", "openqasm", "simulator"]
categories = ["science", "simulation"]

[dependencies]

# The simulator comparison tests run hundreds of thousands of shots; unoptimized builds make them ~50x slower.
[profile.test]
opt-level = 2

[package]
name = "qxide"
version = "0.7.0"
edition = "2021"
description = "Qxide: a language and Rust library for classical and quantum computers with C-style syntax, compile-time qubit safety like Rust's ownership, and OpenQASM 3 output"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qxide-lang/qxide"
homepage = "https://qxide.dev"
readme = "README.md"
keywords = ["quantum", "qubit", "openqasm", "simulator"]
categories = ["science", "simulation"]
# Keep the website, brand assets, CI files and design docs out of the published crate.
# Exceptions: `qxide explain` embeds docs/error-codes.md, and its tests read the design doc's code tables.
include = ["/src/**", "/tests/**", "/examples/**", "/README.md", "/README.ko.md", "/CHANGELOG.md", "/LICENSE-*", "/Cargo.lock", "/docs/error-codes.md", "/docs/design/qx-language.md"]

[features]
default = ["cli"]
# The `qxide` command-line tool, including its package manager. Library users can opt out with
# `default-features = false`; the library itself has no required dependencies.
cli = ["dep:semver", "dep:toml_edit", "dep:serde_json", "dep:sha2", "dep:tar", "dep:flate2"]
# GPU state-vector backend (prototype). Pulls in CubeCL + wgpu, so it is off by default.
gpu = ["dep:cubecl"]

[dependencies]
cubecl = { version = "=0.11.4", default-features = false, features = ["wgpu"], optional = true }
flate2 = { version = "1.1", optional = true }
semver = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
toml_edit = { version = "0.25", optional = true }

[[bin]]
name = "qxide"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = ["crates/qxide-wasm"]

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

# The simulator comparison tests run hundreds of thousands of shots; unoptimized builds make them ~50x slower.
[profile.test]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Browser playground build (crates/qxide-wasm): small code, no unwinding.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

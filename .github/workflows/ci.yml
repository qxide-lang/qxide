name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p qxide-wasm --target wasm32-unknown-unknown -- -D warnings
      # Includes crates/qxide-wasm, whose tests compare the playground binding with the CLI binary.
      - run: cargo test --workspace

  # The built playground module must print exactly what the CLI prints. Both scripts use only Node
  # built-ins, so no npm install is needed.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-wasm.mjs
        working-directory: site
      - run: node scripts/parity.mjs
        working-directory: site

  # CI runners have no GPU, so the `gpu` feature is only built and linted here; its tests run locally.
  gpu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features gpu -- -D warnings

  # Our OpenQASM 3 output must load in a real third-party tool, not just match our own expectations.
  qasm-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "qiskit==2.6.2" qiskit-qasm3-import "openqasm3[parser]==1.0.2"
      - run: cargo run --example qasm_dump -- qasm-out
      - run: for f in examples/qx/*.qx; do cargo run -q -- qasm "$f" > "qasm-out/qx_$(basename "$f" .qx).qasm"; done
      - run: python ci/check_qasm.py qasm-out

  # registry-template/scripts run in the registry repository; test them here on throwaway registries.
  registry-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I ci/test_registry_scripts.py

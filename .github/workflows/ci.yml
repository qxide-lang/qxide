name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p qxide-wasm --target wasm32-unknown-unknown -- -D warnings
      # Includes crates/qxide-wasm, whose tests compare the playground binding with the CLI binary.
      - run: cargo test --workspace
      # `qxide::lang` (roadmap 4b) is built only with `unstable-lang`.
      - run: cargo clippy --all-targets --features unstable-lang -- -D warnings
      - run: cargo test --features unstable-lang --test lang_api

  # The built playground module must print exactly what the CLI prints. These scripts use only Node
  # built-ins, so no npm install is needed.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/build-wasm.mjs
        working-directory: site
      - run: node scripts/parity.mjs
        working-directory: site
      - run: node --expose-gc scripts/share-test.mjs
        working-directory: site

  # Release binaries are built with the Cranelift JIT (`jit` feature), so it is linted and tested on
  # every release platform family, including AArch64 macOS.
  jit-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --features jit -- -D warnings
      - run: cargo test --features jit

  # `import qxide` (roadmap 4c) runs the CLI from the same wheel, so build and install a real wheel.
  python-module:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.16,<2"
      - run: maturin build --locked --out dist
      - run: pip install dist/*.whl
        shell: bash
      - run: python -m unittest discover -s python/tests -v

  # CI runners have no GPU, so the `gpu` feature is only built and linted here; its tests run locally.
  gpu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --features gpu -- -D warnings

  # Our OpenQASM 3 output must load in a real third-party tool, not just match our own expectations.
  qasm-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "qiskit==2.6.2" qiskit-qasm3-import "openqasm3[parser]==1.0.2" "qiskit-ibm-runtime==0.52.1"
      - run: cargo run --example qasm_dump -- qasm-out
      - run: for f in examples/qx/*.qx; do cargo run -q -- qasm "$f" > "qasm-out/qx_$(basename "$f" .qx).qasm"; done
      - run: python ci/check_qasm.py qasm-out
      # `run --backend --dry-run` device circuits against offline IBM device snapshots (no network).
      - run: cargo build -q && python ci/check_isa.py target/debug/qxide isa-out examples/qx/*.qx

  # The VS Code extension must install, test, and package on Linux as vscode.yml does for releases.
  # The language server test needs target/debug/qxide, so it is skipped here.
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npx vsce package --out qxide-vscode-ci.vsix && npx vsce ls
        working-directory: editors/vscode

  # registry-template/scripts run in the registry repository; test them here on throwaway registries.
  registry-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I ci/test_registry_scripts.py
